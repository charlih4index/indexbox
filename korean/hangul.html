<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangul</title>
<style>
  body { font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; margin: 2em auto; max-width: 960px; padding: 0 1em; color: #222; }
  h1 { font-weight: bold; font-size: 3em; margin: 0 0 0.2em; }
  hr { border: none; border-top: 2px solid #222; margin: 1em 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; white-space: nowrap; }
  td:nth-child(1) { font-size: 1.5em; white-space: nowrap; }
  #status { color: #666; }
  #search { margin: 0 0 1em; }
  #search input { font-size: 1.1em; padding: 6px 10px; width: 10em; }
  #search button { font-size: 1.1em; padding: 6px 14px; margin-left: 6px; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title"></h1>
<hr>
<form id="search">
  <input id="q" type="text" placeholder="Enter a Hangul word" aria-label="Word to look up" autocomplete="off">
  <button type="submit">Search</button>
</form>
<div id="status">Loading\u2026</div>
<div id="content"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var hg = params.get('hangul') || '';
  document.title = hg || 'Hangul';
  document.getElementById('title').textContent = hg;
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  document.getElementById('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    window.location.search = '?hangul=' + encodeURIComponent(v);
  });
  if (!hg) {
    document.getElementById('status').textContent = 'Enter a word above to look up.';
    return;
  }
  function load(url, source) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
      return r.json();
    }).then(function (data) {
      return { ok: true, rows: data.map(function (e) {
        return { hangul: e.hangul, meaning: e.meaning, alphabet: e.alphabet, source: source };
      }) };
    }).catch(function () {
      return { ok: false, rows: [] };
    });
  }
  Promise.all([load('hangul.json', 'kengdic'), load('hangul1.json', 'ebook')])
    .then(function (parts) {
      var status = document.getElementById('status');
      var loaded = parts.filter(function (p) { return p.ok; });
      if (!loaded.length) {
        status.textContent = 'Failed to load data.';
        return;
      }
      var rows = parts[0].rows.concat(parts[1].rows).filter(function (r) { return r.hangul === hg; });
      if (!rows.length) {
        status.textContent = 'No entries found for "' + hg + '".';
        return;
      }
      var note = loaded.length < parts.length ? ' (some sources unavailable)' : '';
      status.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' found.' + note;
      var cols = ['hangul', 'meaning', 'alphabet', 'source'];
      var html = '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>' + cols.map(function (c) {
          return '<td>' + esc(r[c]) + '</td>';
        }).join('') + '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
    });
})();
</script>
</body>
</html>
