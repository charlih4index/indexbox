<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jdict</title>
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; margin: 2em auto; max-width: 960px; padding: 0 1em; color: #222; }
  h1 { font-weight: bold; font-size: 3em; margin: 0 0 0.2em; }
  hr { border: none; border-top: 2px solid #222; margin: 1em 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; white-space: nowrap; }
  td:first-child { font-size: 1.5em; white-space: nowrap; }
  td a.contrib { display: inline-block; border: 1.5px solid #1663c7; color: #1663c7; border-radius: 8px; padding: 2px 10px; text-decoration: none; font-weight: 600; white-space: nowrap; }
  #status { color: #666; }
  #search { margin: 0 0 1em; }
  #search input { font-size: 1.1em; padding: 6px 10px; width: 12em; }
  #search button { font-size: 1.1em; padding: 6px 14px; margin-left: 6px; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title"></h1>
<hr>
<p><a href="jdict_index.html">&larr; Pre-index</a></p>
<form id="search">
  <input id="q" type="text" placeholder="Enter a Japanese word" aria-label="Word to look up" autocomplete="off">
  <button type="submit">Search</button>
</form>
<div id="status">Loading\u2026</div>
<div id="content"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var px = params.get('prefix') || '';
  var jp = params.get('japanese') || '';
  document.title = px || jp || 'Jdict';
  document.getElementById('title').textContent = px || jp;
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function kanaPrefix(s) {
    var m = String(s).normalize('NFKC').match(/[\u3040-\u309F\u30A0-\u30FF]/g);
    return (m && m.length >= 2) ? m[0] + m[1] : null;
  }
  document.getElementById('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    window.location.search = '?japanese=' + encodeURIComponent(v);
  });
  if (!px && !jp) {
    document.getElementById('status').textContent = 'Enter a word above to look up, or pick a prefix from the pre-index.';
    return;
  }
  fetch('jdict.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var rows, status = document.getElementById('status');
      if (px) {
        rows = data.filter(function (r) { return kanaPrefix(r.japanese) === px; });
        if (!rows.length) {
          status.textContent = 'No entries found for prefix "' + px + '".';
          return;
        }
      } else {
        rows = data.filter(function (r) { return r.japanese.indexOf(jp) === 0; });
        if (!rows.length) {
          status.textContent = 'No entries found for "' + jp + '".';
          return;
        }
      }
      status.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' found.';
      var cols = ['japanese', 'english', 'category', 'category2', 'japanese2'];
      var html = '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th>A=B</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>' + cols.map(function (c) {
          return '<td>' + esc(r[c]) + '</td>';
        }).join('') + '<td><a class="contrib" href="/a=b.html?a=' + encodeURIComponent(r.japanese) + '" target="_blank">Contribute A=B</a></td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'Failed to load data: ' + e.message;
    });
})();
</script>
</body>
</html>
