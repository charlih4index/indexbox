version: 1
project:
  title: indexbox.com
  # authors:
  #   - name: Author Name
  copyright: '©2026 Indexbox. All rights reserved.'
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
  # github: opengeos/myst-website-template
  #  thebe:
  #    binder:
  #      repo: opengeos/myst-website-template
  #      provider: github
  #      url: https://mybinder.org
  #      ref: main
  bibliography:
    - pages/references.bib
  toc:
    - file: index.md
    - title: Preface
      children:
        - file: pages/preface.md
    - title: Getting Started
      children:
        - file: pages/part01/getting-started.md
        - file: pages/part01/installation.md
    - title: Examples
      children:
        - file: pages/part02/first-example.md
    - title: English
      children:
        - file: english/english.md
        - file: english/A.md
        - file: english/B.md
        - file: english/C.md
    - title: Chinese
      children:
        - file: chinese/chinese.md
        - file: chinese/ㄅ.md
        - file: chinese/ㄆ.md
        - file: chinese/ㄇ.md
        - file: chinese/ㄈ.md
        - title: Zhuyin <!-- Sub-children or grand children -->
          children:
            - file: chinese/ㄅ.md <!-- Sub-children or grand children -->
          #  - file: chinese/ㄆ.md <!-- Sub-children or grand children -->
          #  - file: chinese/ㄇ.md <!-- Sub-children or grand children -->
          #  - file: chinese/ㄈ.md <!-- Sub-children or grand children -->
    - title: Japanese
      children:
        - file: japanese/japanese.md
    - title: Korean
      children:
        - file: korean/korean.md    
    - file: blog.md
      children:
        - file: tags/myst-markdown.md
        - file: tags/tutorial.md
        - file: tags/github-pages.md
    - pattern: posts/*.md
      hidden: true
site:
  options:
    logo: logo.png
    logo_dark: logo.png
    favicon: fav.ico
    folders: true
    style: custom.css
    # analytics_google: G-XXX
  actions:
    - title: RSS
      url: https://opengeos.org/myst-website-template/rss.xml
  template: book-theme
  parts:
    primary_sidebar_footer: ''
