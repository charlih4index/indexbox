name: deploy

on:
  push:
    branches:
      - main
      
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install feedgen pyyaml

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML Assets
        # Remove BASE_URL if using a custom domain (CNAME)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: myst build --html
      - run: mkdir -p _build/html/english && cp english/A.html english/B.html english/C.html english/D.html english/E.html english/F.html english/G.html english/H.html english/I.html english/J.html english/K.html english/L.html english/M.html english/N.html english/O.html english/P.html english/Q.html english/R.html english/S.html english/T.html english/U.html english/V.html english/W.html english/X.html english/Y.html english/Z.html _build/html/english/
      #- run: mkdir -p _build/html/chinese && cp chinese/ZhuyinTable.html _build/html/chinese/
      - run: mkdir -p _build/html/chinese && cp chinese/ZhuyinTable.html _build/html/chinese/ && mkdir -p _build/html/chinese/img && cp chinese/img/*.png _build/html/chinese/img/
      #- run: cp chinese/character.html chinese/chinese_word.json _build/html/chinese/
      - run: cp chinese/character.html chinese/zhuyin.html chinese/chinese_word.json _build/html/chinese/
      #- run: mkdir -p _build/html/korean && cp korean/hangul_table.html _build/html/korean/ 
      #- run: mkdir -p _build/html/korean && cp korean/hangul_table.html korean/hangul.html korean/hangul.json _build/html/korean/
      - run: mkdir -p _build/html/korean && cp korean/hangul_table.html korean/hangul.html korean/hangul.json korean/hangul1.json _build/html/korean/
      - run: mkdir -p _build/html/japanese && cp japanese/*.html japanese/jdict.json _build/html/japanese/
        #   BASE_URL: /${{ github.event.repository.name }}
        # run: myst build --html

      - name: Checkout tennis site
        uses: actions/checkout@v6
        with:
          repository: charlih4index/tennis
          path: tennis-src

      - name: Copy tennis site
        run: |
          mkdir -p _build/html/tennis
          cp -r tennis-src/. _build/html/tennis/
          rm -rf _build/html/tennis/.git _build/html/tennis/README.md _build/html/tennis/tennis.md _build/html/tennis/committee/htpasswd
          find _build/html/tennis -name _vti_cnf -type d -exec rm -rf {} + 2>/dev/null || true
          find _build/html/tennis \( -name Thumbs.db -o -name .gitkeep -o -name Picasa.ini -o -name '*_ip.txt' -o -name '*_logfile.txt' -o -name '*mail-list*' -o -name chap.member \) -delete

      - name: Checkout indexdatabase for A=B page
        uses: actions/checkout@v6
        with:
          repository: charlih4index/indexdatabase
          path: indexdatabase-src

      - name: Copy A=B page and inject TiDB keys
        env:
           TIDB_PUBLIC_KEY: ${{ secrets.TIDB_PUBLIC_KEY }}
           TIDB_PRIVATE_KEY: ${{ secrets.TIDB_PRIVATE_KEY }}
        run: |
          cp indexdatabase-src/sandbox/a=b.html _build/html/a=b.html
          sed -i "s/PASTE_PUBLIC_KEY_HERE/$TIDB_PUBLIC_KEY/; s/PASTE_PRIVATE_KEY_HERE/$TIDB_PRIVATE_KEY/" "_build/html/a=b.html"
  
      - name: Generate RSS and Atom feeds
        run: python generate_rss.py

      #- name: Inject Giscus comments into blog posts
    #    run: python inject_comments.py

      - name: Copy static files
        run: |
          cp CNAME ./_build/html/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
