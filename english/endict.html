<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endict</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;line-height:1.6}
h1 { font-weight: bold; font-size: 3em; margin: 0 0 0.2em; }
hr { border: none; border-top: 2px solid #222; margin: 1em 0; }
  .title-row { display: flex; align-items: center; gap: 2em; flex-wrap: wrap; }
  .title-row h1 { margin: 0; }
table{border-collapse:collapse;width:100%;margin:20px 0}
th,td{border:1px solid #ddd;padding:8px 12px;text-align:left;vertical-align:top}
th{background:#f5f5f5;font-weight:600}
tr:nth-child(even){background:#fafafa}
a{color:#0066cc;text-decoration:none}a:hover{text-decoration:underline}
.nav{margin:20px 0}.nav a{margin-right:15px}
#status { color: #666; }
#search { margin: 0; }
#search input { font-size: 1.1em; padding: 6px 10px; width: 12em; }
#search button { font-size: 1.1em; padding: 6px 14px; margin-left: 6px; cursor: pointer; }
</style><style>a.contrib{display:inline-block;border:1.5px solid #1663c7;color:#1663c7;border-radius:8px;padding:2px 10px;text-decoration:none;font-weight:600;white-space:nowrap}a.contrib:hover{background:#1663c7;color:#fff}</style>
</head><body>
<div class="nav"><a href="/english/english/">← English Index</a></div>
<div class="title-row"><h1 id="title">English Dictionary</h1>
<form id="search" action="/english/endict.html" method="get">
  <input type="text" name="english" placeholder="Enter an English word" aria-label="Word to look up" autocomplete="off">
  <button type="submit">Search</button>
</form></div>
<hr>
<div id="status">Loading…</div>
<div id="content"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var q = params.get('english') || '';
  document.title = q || 'Endict';
  document.getElementById('title').textContent = q || 'English Dictionary';
  var input = document.querySelector('#search input[name="english"]');
  if (input) input.value = q;
  var status = document.getElementById('status');
  if (!q) {
    status.textContent = 'Enter a word above to look up.';
    return;
  }
  function dec(s) {
    return String(s == null ? '' : s)
      .replace(/&#x27;/g, "'").replace(/&#39;/g, "'")
      .replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&amp;/g, '&');
  }
  fetch('endict.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var ql = q.toLowerCase();
      var rows = data.filter(function (r) { return dec(r.word).toLowerCase().indexOf(ql) === 0; });
      if (!rows.length) {
        status.textContent = 'No entries found for "' + q + '".';
        return;
      }
      status.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' found.';
      var html = '<table><thead><tr><th>English</th><th>Chinese</th><th>Dictionary1</th><th>Dictionary2</th><th>Dictionary3</th><th>wikimedia</th><th>A=B</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        var w = dec(r.word), low = encodeURIComponent(w.toLowerCase()).replace(/'/g, '%27'), enc = encodeURIComponent(w).replace(/'/g, '%27');
        html += '<tr><td>' + r.word + '</td><td>' + r.definition + '</td>'
          + '<td><a href="https://www.merriam-webster.com/dictionary/' + low + '">Merriam Webster</a></td>'
          + '<td><a href="https://dictionary.cambridge.org/us/dictionary/english/' + low + '">Cambridge Dictionary</a></td>'
          + '<td><a href="https://tw.dictionary.search.yahoo.com/search?p=' + low + '">Yahoo! Dictionary</a></td>'
          + '<td><a href="https://en.wikipedia.org/wiki/' + enc + '">wikimedia</a></td>'
          + '<td><a class="contrib" href="/a=b.html?a=' + enc + '" target="_blank">Contribute A=B</a></td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
    })
    .catch(function (e) { status.textContent = 'Failed to load the dictionary: ' + e.message; });
})();
</script>
</body></html>
