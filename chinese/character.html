<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 2em auto; max-width: 960px; padding: 0 1em; color: #222; }
  h1 { font-weight: bold; font-size: 3em; margin: 0 0 0.2em; }
  hr { border: none; border-top: 2px solid #222; margin: 1em 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; white-space: nowrap; }
  td:first-child { font-size: 1.5em; white-space: nowrap; }
  #status { color: #666; }
  #search { margin: 0 0 1em; }
  #search input { font-size: 1.1em; padding: 6px 10px; width: 10em; }
  #search button { font-size: 1.1em; padding: 6px 14px; margin-left: 6px; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title"></h1>
<hr>
<form id="search">
  <input id="q" type="text" placeholder="輸入一個中文字" aria-label="Character to look up" autocomplete="off">
  <button type="submit">Search</button>
</form>
<div id="status">Loading…</div>
<div id="content"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var ch = params.get('char') || '';
  document.title = ch || 'Character';
  document.getElementById('title').textContent = ch;
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  document.getElementById('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    window.location.search = '?char=' + encodeURIComponent(v.charAt(0));
  });
  if (!ch) {
    document.getElementById('status').textContent = 'Enter a character above to look up.';
    return;
  }
  fetch('chinese_word.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var rows = data.filter(function (r) { return r.character === ch; });
      var status = document.getElementById('status');
      if (!rows.length) {
        status.textContent = 'No entries found for "' + ch + '".';
        return;
      }
      status.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' found.';
      var cols = ['character', 'type', 'zhuyin', 'zhuyin2', 'pinyin', 'definitions'];
      var html = '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>' + cols.map(function (c) { return '<td>' + esc(r[c]) + '</td>'; }).join('') + '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'Failed to load data: ' + e.message;
    });
})();
</script>
</body>
</html>
