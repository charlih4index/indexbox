<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zhuyin</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 2em auto; max-width: 960px; padding: 0 1em; color: #222; }
  h1 { font-weight: bold; font-size: 3em; margin: 0 0 0.2em; }
  hr { border: none; border-top: 2px solid #222; margin: 1em 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; white-space: nowrap; }
  td:nth-child(4) { font-size: 1.5em; white-space: nowrap; }
  #status { color: #666; }
  #search { margin: 0 0 1em; }
  #search input { font-size: 1.1em; padding: 6px 10px; width: 10em; }
  #search button { font-size: 1.1em; padding: 6px 14px; margin-left: 6px; cursor: pointer; }
  td a.contrib { display: inline-block; border: 1.5px solid #1663c7; color: #1663c7; border-radius: 8px; padding: 2px 10px; text-decoration: none; font-weight: 600; white-space: nowrap; }
  #picker { margin: 0 0 1em; }
  #picker table { border-collapse: collapse; width: auto; }
  #picker td { border: 2px solid #222; padding: 8px 10px; text-align: center; vertical-align: middle; }
  #picker td.empty { border: none; }
  #picker select { font-size: 1.3em; }
  #picker-result { font-size: 2em; font-weight: bold; min-height: 1.2em; margin-right: 0.3em; }
  #picker-search { font-size: 1.1em; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title"></h1>
<hr>
<form id="search">
  <input id="q" type="text" placeholder="輸入一個注音" aria-label="Syllable to look up" autocomplete="off">
  <button type="submit">Search</button>
</form>
<div id="picker">
  <table>
    <tr>
      <td>
        <select id="pkA" aria-label="Neutral tone">
          <option value="" selected>␢</option>
          <option value="˙">˙</option>
        </select>
      </td>
      <td rowspan="2" class="empty"></td>
    </tr>
    <tr>
      <td>
        <select id="pkB" aria-label="Initial">
          <option value="" selected>␢</option>
          <option>ㄅ</option>
          <option>ㄆ</option>
          <option>ㄇ</option>
          <option>ㄈ</option>
          <option>ㄉ</option>
          <option>ㄊ</option>
          <option>ㄋ</option>
          <option>ㄌ</option>
          <option>ㄍ</option>
          <option>ㄎ</option>
          <option>ㄏ</option>
          <option>ㄐ</option>
          <option>ㄑ</option>
          <option>ㄒ</option>
          <option>ㄓ</option>
          <option>ㄔ</option>
          <option>ㄕ</option>
          <option>ㄖ</option>
          <option>ㄗ</option>
          <option>ㄘ</option>
          <option>ㄙ</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <select id="pkC" aria-label="Medial">
          <option value="" selected>␢</option>
          <option>ㄧ</option>
          <option>ㄨ</option>
          <option>ㄩ</option>
        </select>
      </td>
      <td>
        <select id="pkD" aria-label="Tone">
          <option value="" selected>␢</option>
          <option>ˊ</option>
          <option>ˇ</option>
          <option>ˋ</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <select id="pkE" aria-label="Final">
          <option value="" selected>␢</option>
          <option>ㄚ</option>
          <option>ㄛ</option>
          <option>ㄜ</option>
          <option>ㄝ</option>
          <option>ㄞ</option>
          <option>ㄟ</option>
          <option>ㄠ</option>
          <option>ㄡ</option>
          <option>ㄢ</option>
          <option>ㄣ</option>
          <option>ㄤ</option>
          <option>ㄥ</option>
          <option>ㄦ</option>
        </select>
      </td>
      <td class="empty"></td>
    </tr>
  </table>
  <div><span id="picker-result"></span><button id="picker-search" type="button">Search</button></div>
</div>
<div id="status">Loading…</div>
<div id="content"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var zy = params.get('zhuyin') || '';
  document.title = zy || 'Zhuyin';
  document.getElementById('title').textContent = zy;
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  document.getElementById('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    window.location.search = '?zhuyin=' + encodeURIComponent(v);
  });
  // Syllable picker: 5 dropdowns (neutral tone, initial, medial, tone, final)
  // combined as ˙? + initial + medial + final + tone, same as the sandbox helper.
  var pkA = document.getElementById('pkA');
  var pkB = document.getElementById('pkB');
  var pkC = document.getElementById('pkC');
  var pkD = document.getElementById('pkD');
  var pkE = document.getElementById('pkE');
  function combineZhuyin() {
    var out = '';
    if (pkA.value === '˙') out += '˙';
    out += pkB.value + pkC.value + pkE.value + pkD.value;
    document.getElementById('picker-result').textContent = out;
    return out;
  }
  [pkA, pkB, pkC, pkD, pkE].forEach(function (el) {
    el.addEventListener('change', combineZhuyin);
  });
  document.getElementById('picker-search').addEventListener('click', function () {
    var v = combineZhuyin();
    if (!v) return;
    window.location.search = '?zhuyin=' + encodeURIComponent(v);
  });
  // Pre-select the dropdowns from the current ?zhuyin= value, if any.
  if (zy) {
    var rest = zy;
    if (rest.charAt(0) === '˙') { pkA.value = '˙'; rest = rest.slice(1); }
    var last = rest.charAt(rest.length - 1);
    if (last === 'ˊ' || last === 'ˇ' || last === 'ˋ') { pkD.value = last; rest = rest.slice(0, -1); }
    var initials = 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ';
    var medials = 'ㄧㄨㄩ';
    var finals = 'ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ';
    for (var i = 0; i < rest.length; i++) {
      var ch = rest.charAt(i);
      if (initials.indexOf(ch) !== -1) pkB.value = ch;
      else if (medials.indexOf(ch) !== -1) pkC.value = ch;
      else if (finals.indexOf(ch) !== -1) pkE.value = ch;
    }
  }
  combineZhuyin();
  if (!zy) {
    document.getElementById('status').textContent = 'Enter a syllable above to look up.';
    return;
  }
  fetch('chinese_word.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var rows = data.filter(function (r) { return r.zhuyin === zy; });
      var status = document.getElementById('status');
      if (!rows.length) {
        status.textContent = 'No entries found for "' + zy + '".';
        return;
      }
      status.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' found.';
      var cols = ['zhuyin', 'zhuyin2', 'pinyin', 'character', 'type', 'definitions'];
      var html = '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th>A=B</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>' + cols.map(function (c) {
          if (c === 'character') {
            return '<td><a href="/chinese/character.html?char=' + esc(r[c]) + '" target="_blank">' + esc(r[c]) + '</a></td>';
          }
          return '<td>' + esc(r[c]) + '</td>';
        }).join('') + '<td><a class="contrib" href="/a=b.html?a=' + encodeURIComponent(r.character) + '" target="_blank">Contribute A=B</a></td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'Failed to load data: ' + e.message;
    });
})();
</script>
</body>
</html>
